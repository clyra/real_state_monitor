[project]
name = "real_estate_monitor"
version = "0.1.0"
description = "Monitor real-estate agency listing pages for rental houses"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "lxml>=5.0.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
real-estate-monitor = "real_estate_monitor.cli:app"

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["real_estate_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
