<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Imoveis Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .listing-card { transition: transform 0.2s, box-shadow 0.2s; }
        .listing-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .listing-img { height: 200px; object-fit: cover; width: 100%; }
        .event-badge { font-size: 0.75rem; }
        .verified-check { color: #198754; }
        .unverified-check { color: #dc3545; }
        .sidebar { min-height: calc(100vh - 56px); background: #f8f9fa; }
        .card-img-placeholder { height: 200px; background: #e9ecef; display: flex; align-items: center; justify-content: center; color: #6c757d; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="bi bi-house-door"></i> Imoveis Monitor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/listings' %}active{% endif %}" href="{{ url_for('listings') }}">
                            <i class="bi bi-grid-3x3-gap"></i> Imoveis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/favorites' %}active{% endif %}" href="{{ url_for('favorites') }}">
                            <i class="bi bi-heart-fill"></i> Favoritos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/events' %}active{% endif %}" href="{{ url_for('events') }}">
                            <i class="bi bi-clock-history"></i> Eventos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/duplicates' %}active{% endif %}" href="{{ url_for('duplicates') }}">
                            <i class="bi bi-copy"></i> Duplicatas
                        </a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <a class="nav-link" href="{{ url_for('logout') }}">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
